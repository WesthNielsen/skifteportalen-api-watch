services:
  - type: cron
    name: skifteportalen-api-watch
    runtime: python
    schedule: "0 7 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python monitor.py
    envVars:
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        sync: false
      - key: GITHUB_BRANCH
        value: main
      - key: STATE_PATH
        value: monitoring/skifteportalen-state.json
      - key: DISCORD_WEBHOOK_URL
        sync: false
